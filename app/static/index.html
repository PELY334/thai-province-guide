<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Province Guide</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1da;
          --accent:#0f6e5c; --warn:#a4501b; --chip:#e7f2ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151614; --card:#1e1f1c; --ink:#ecebe6; --muted:#a3a29b; --line:#33342f;
            --accent:#5cc2a8; --warn:#e39a63; --chip:#1f3530; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:12px 14px; border:1px solid var(--line);
         border-radius:10px; background:var(--card); color:var(--ink); font-size:1rem; }
  select, button { padding:12px 14px; border-radius:10px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); font-size:1rem; }
  button.go { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .examples { margin:12px 0 22px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { font-size:.85rem; padding:6px 10px; cursor:pointer; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:14px; }
  .label { font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
           margin-bottom:8px; }
  #answer { font-size:1.1rem; }
  .abstain { color: var(--warn); }
  .cite { display:inline-block; background:var(--chip); color:var(--accent); border-radius:6px;
          padding:0 6px; margin-left:3px; font-size:.85rem; font-weight:600; text-decoration:none; }
  ol.steps { margin:0; padding-left:20px; color:var(--muted); font-size:.9rem; }
  ol.steps code { color:var(--ink); }
  .src { border-top:1px solid var(--line); padding:10px 0; font-size:.9rem; }
  .src:first-of-type { border-top:0; }
  .src.used { background: var(--chip); margin: 0 -18px; padding: 10px 18px; }
  .src b a { color:var(--accent); }
  .src .meta { color:var(--muted); font-size:.8rem; }
  .hidden { display:none; }
  footer { color:var(--muted); font-size:.8rem; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Thai Province Guide</h1>
  <p class="sub">Ask about any of Thailand's 77 provinces. Answers come only from the Wikipedia
    articles and cite their sources; if the articles don't say, it abstains.</p>

  <form id="f">
    <input id="q" type="text" placeholder="e.g. What is the provincial tree of Lampang?" required
           minlength="3" maxlength="500" autocomplete="off">
    <select id="mode" aria-label="Mode">
      <option value="agent">Agent (tools)</option>
      <option value="rag">RAG (single shot)</option>
    </select>
    <button class="go" id="go">Ask</button>
  </form>
  <div class="examples" id="ex"></div>

  <div class="card hidden" id="stepsCard"><div class="label">Agent steps</div><ol class="steps" id="steps"></ol></div>
  <div class="card hidden" id="answerCard"><div class="label">Answer</div><div id="answer"></div></div>
  <div class="card hidden" id="srcCard"><div class="label">Sources</div><div id="sources"></div></div>
  <footer>Corpus: English Wikipedia (CC BY-SA 4.0). Model: <span id="model">…</span></footer>
</main>
<script>
const EXAMPLES = [
  "What is the provincial flower of Chiang Mai?",
  "Which river flows through Nan province?",
  "How much larger is Chiang Mai province than Lamphun province, in km²?",
  "What is the best pad thai restaurant in Phuket?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

for (const e of EXAMPLES) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = e;
  b.onclick = () => { $("q").value = e; $("f").requestSubmit(); };
  $("ex").appendChild(b);
}
fetch("/api/health").then(r => r.json()).then(h => $("model").textContent =
  `${h.model} · ${h.retriever} retrieval · min_score ${h.min_score}`).catch(() => {});

function addStep(s) {
  $("stepsCard").classList.remove("hidden");
  const li = document.createElement("li");
  const args = typeof s.args === "object" ? Object.values(s.args).join(", ") : s.args;
  li.innerHTML = `<code>${esc(s.tool)}</code>(${esc(args)}) ${s.ok ? "" : "<span class='abstain'>✗</span>"}`;
  li.title = s.result || "";
  $("steps").appendChild(li);
}

function showFinal(r) {
  $("answerCard").classList.remove("hidden");
  const cites = r.citations.map(n => `<a class="cite" href="#src${n}">${n}</a>`).join("");
  $("answer").innerHTML = r.abstained ? `<span class="abstain">${esc(r.answer)}</span>`
                                      : `${esc(r.answer)} ${cites}`;
  if (r.sources.length) {
    $("srcCard").classList.remove("hidden");
    $("sources").innerHTML = r.sources.map(s => `
      <div class="src ${r.citations.includes(s.n) ? "used" : ""}" id="src${s.n}">
        <b>[${s.n}] <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.province)}</a></b>
        <span class="meta">— ${esc(s.section)} · cosine ${s.cosine.toFixed(3)}</span>
        <div>${esc(s.text.length > 420 ? s.text.slice(0, 420) + "…" : s.text)}</div>
      </div>`).join("");
  }
}

$("f").onsubmit = async (ev) => {
  ev.preventDefault();
  for (const id of ["stepsCard", "answerCard", "srcCard"]) $(id).classList.add("hidden");
  $("steps").innerHTML = ""; $("answer").textContent = ""; $("sources").innerHTML = "";
  $("go").disabled = true; $("go").textContent = "Thinking…";
  try {
    const res = await fetch("/api/ask/stream", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: $("q").value, mode: $("mode").value }) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail ? JSON.stringify(e.detail) : res.statusText); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (frame.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((frame.match(/^data: (.*)$/m) || [, "{}"])[1]);
        if (ev === "step") addStep(data);
        else if (ev === "final") showFinal(data.response);
        else if (ev === "error") throw new Error(data.message);
      }
    }
  } catch (e) {
    $("answerCard").classList.remove("hidden");
    $("answer").innerHTML = `<span class="abstain">Error: ${esc(e.message)}</span>`;
  } finally { $("go").disabled = false; $("go").textContent = "Ask"; }
};
</script>
</body>
</html>
